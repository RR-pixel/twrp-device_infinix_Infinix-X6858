name: Build OrangeFox X6858

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android
        sudo apt-get clean

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison \
        build-essential zip curl zlib1g-dev libc6-dev-i386 \
        libncurses5 lib32ncurses5-dev x11proto-core-dev \
        libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
        xsltproc unzip fontconfig python3 python-is-python3

    - name: Setup repo tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo \
          > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize TWRP manifest
      run: |
        mkdir -p OrangeFox
        cd OrangeFox
        repo init \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp \
          -b twrp-12.1 \
          --depth=1

    - name: Sync source
      run: |
        cd OrangeFox
        repo sync -c -j$(nproc --all) \
          --force-sync \
          --no-clone-bundle \
          --no-tags

    - name: Setup OrangeFox overlay
      run: |
        cd OrangeFox
        rm -rf bootable/recovery
        git clone \
          https://gitlab.com/OrangeFox/bootable/recovery.git \
          -b fox_12.1 bootable/recovery
        git clone \
          https://gitlab.com/OrangeFox/vendor/recovery.git \
          -b fox_12.1 vendor/recovery

    - name: Clone device trees
      run: |
        cd OrangeFox
        git clone \
          https://github.com/${{ github.repository_owner }}/twrp-device_infinix_Infinix-X6858 \
          -b fox_12.1-tos15 \
          device/infinix/Infinix-X6858
        git clone \
          https://github.com/${{ github.repository_owner }}/twrp-device_transsion_mt6789-common \
          -b fox_12.1-tranos15 \
          device/transsion/mt6789-common

    - name: Build OrangeFox
      run: |
        cd OrangeFox
        source build/envsetup.sh
        lunch twrp_Infinix-X6858-eng
        mka vendorbootimage

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-X6858-XOS16
        path: |
          OrangeFox/out/target/product/Infinix-X6858/vendor_boot.img
        if-no-files-found: warn
